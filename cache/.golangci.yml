version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused
    - exhaustive
    - bodyclose
    - contextcheck
    - durationcheck
    - errorlint
    - gocritic
    - nilerr
    - noctx
    - modernize
    - goconst
    - gocyclo
    - perfsprint
    - prealloc
  settings:
    exhaustive:
      default-signifies-exhaustive: false

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

exclusions:
  paths:
    - vendor
    - testdata